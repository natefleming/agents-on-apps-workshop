# yaml-language-server: $schema=https://json.schemastore.org/databricks-asset-bundles.json
# Databricks Asset Bundle for the Agents on Apps Workshop - Memory Chapter

bundle:
  name: agents-workshop-memory

variables:
  resource_name_suffix:
    description: "Suffix for resource names to avoid collisions between users"
  lakebase_project:
    description: "Name of the Lakebase autoscaling project for agent memory storage"
  lakebase_branch:
    description: "Lakebase branch name (default: production)"
    default: "production"

resources:
  # MLflow Experiment for agent tracing and evaluation
  experiments:
    agent_experiment:
      name: /Users/${workspace.current_user.userName}/agents-workshop-memory
      permissions:
        - level: CAN_MANAGE
          group_name: users

  # The Databricks App
  apps:
    agent_app:
      name: memory-agent-${var.resource_name_suffix}
      description: "Workshop agent with short-term and long-term memory via Lakebase"
      source_code_path: .

      # App runtime configuration (replaces app.yaml)
      config:
        command:
          - uv
          - run
          - start-app
        env:
          - name: MLFLOW_TRACKING_URI
            value: "databricks"
          - name: MLFLOW_REGISTRY_URI
            value: "databricks-uc"
          - name: API_PROXY
            value: "http://localhost:8000/invocations"
          - name: CHAT_APP_PORT
            value: "3000"
          - name: CHAT_PROXY_TIMEOUT_SECONDS
            value: "300"
          - name: LAKEBASE_PROJECT
            value: ${var.lakebase_project}
          - name: LAKEBASE_BRANCH
            value: ${var.lakebase_branch}

      # Resources the app's service principal needs access to
      resources:
        - name: experiment
          description: "MLflow experiment for tracing agent interactions"
          experiment:
            experiment_id: ${resources.experiments.agent_experiment.id}
            permission: CAN_MANAGE
        - name: llm
          description: "Foundation model endpoint for the agent"
          serving_endpoint:
            name: databricks-claude-sonnet-4-5
            permission: CAN_QUERY
        - name: embeddings
          description: "Embedding model for long-term memory semantic search"
          serving_endpoint:
            name: databricks-gte-large-en
            permission: CAN_QUERY
        # Note: Autoscaling Lakebase projects are not supported as app resources.
        # Grant the app's service principal access to the Lakebase project after deployment:
        #   databricks api post /api/2.0/postgres/projects/<project>/branches/<branch>/roles \
        #     --json '{"role":{"spec":{"auth_method":"LAKEBASE_OAUTH_V1","identity_type":"SERVICE_PRINCIPAL","postgres_role":"<sp-id>"}}}'

      # Who can access the deployed app
      permissions:
        - level: CAN_USE
          group_name: users

# Sync configuration - controls which files are uploaded to the workspace
sync:
  include:
    - "agent_server/**"
    - "scripts/**"
    - "pyproject.toml"
  exclude:
    - ".venv/**"
    - "__pycache__/**"
    - "*.pyc"
    - ".git/**"
    - ".databricks/**"
    - "e2e-chatbot-app-next/**"
    - "temp-app-templates/**"
    - "backend.log"
    - "frontend.log"
    - ".env.local"
    - ".env.example"

# Deployment targets
targets:
  dev:
    mode: development
    default: true
    variables:
      resource_name_suffix: dev-${workspace.current_user.short_name}
      lakebase_project: <your-lakebase-project>

  staging:
    mode: production
    variables:
      resource_name_suffix: "staging"
      lakebase_project: agent-memory-staging

  prod:
    mode: production
    variables:
      resource_name_suffix: "prod"
      lakebase_project: agent-memory-prod
